name: iOS build

# Compile check only: the app is built for the simulator with signing disabled,
# so no certificate or provisioning profile is ever needed here. TestFlight
# builds are produced separately.
#
# macOS runners bill at a higher rate than Linux ones, so the job only runs when
# the iOS app itself changes, and a newer push cancels the run in progress.

on:
  push:
    branches: [main]
    paths:
      - "ios-kudao/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios-kudao/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -switch "$latest/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios-kudao/Kudao.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-

      # The target is built directly instead of through a scheme: schemes are a
      # user-level Xcode artefact and are not committed to the repository.
      - name: Build Kudao
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios-kudao/Kudao.xcodeproj \
            -target Kudao \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions
